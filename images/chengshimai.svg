  <text x="134" y="290" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#d43a1f">1.8</text>
  <rect x="110" y="322" width="360" height="80" rx="10" fill="#221f18" stroke="#3a362e" stroke-width="2"/>
  <text x="134" y="356" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#a29c92">实时气温</text>
  <text x="134" y="390" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#f7f5f0">27°C</text>
  <rect x="110" y="422" width="360" height="80" rx="10" fill="#221f18" stroke="#3a362e" stroke-width="2"/>
  <text x="134" y="456" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#a29c92">空气质量</text>
  <text x="134" y="490" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#f7f5f0">62</text>
  <text x="110" y="556" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#a29c92">数据源轮询</text>
  <circle cx="118" cy="592" r="5" fill="#d43a1f"/>
  <text x="134" y="599" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#8d8880">交通 · 天气 · 城市运行</text>
  <circle cx="118" cy="632" r="5" fill="#e8a33d"/>
  <text x="134" y="639" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="20" fill="#8d8880">每 30 秒刷新</text>

