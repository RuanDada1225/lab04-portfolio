<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1890 810" width="1890" height="810" role="img" aria-label="城市脉搏：城市实时交通与天气数据可视化大屏示意，含指标卡、粒子地图与趋势图">
  <rect width="1890" height="810" fill="#f7f5f0"/>
  <rect x="70" y="70" width="1750" height="670" rx="12" fill="#17150f"/>

  <!-- 标题 -->
  <text x="110" y="142" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="40" font-weight="700" fill="#f7f5f0">城市脉搏 · 实时交通与天气</text>
  <text x="110" y="180" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="22" fill="#8d8880">多数据源轮询聚合 · 响应式大屏</text>

  <!-- 左侧指标 -->
  <rect x="110" y="222" width="360" height="80" rx="10" fill="#221f18" stroke="#3a362e" stroke-width="2"/>
